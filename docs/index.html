<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Paper Suggestions</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:980px;margin:0 auto;padding:40px 20px;background:#f6f8fa;color:#1f2328}header{margin-bottom:28px}h1{font-size:2rem;margin-bottom:6px}.sub{color:#656d76}.card,.fallback{background:white;border:1px solid #d0d7de;border-radius:14px;padding:22px;margin:16px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}.card h2{font-size:1.18rem;margin:0 0 8px}.meta{font-size:.88rem;color:#656d76;margin-bottom:14px}.section{margin-top:14px}.label{font-weight:650}.steal{background:#f0f7ff;border-left:4px solid #0969da;padding:12px 14px;border-radius:6px}.warn{background:#fff8c5;padding:12px 14px;border-radius:6px}.priority{display:inline-block;padding:3px 9px;border-radius:999px;background:#ddf4ff;font-size:.82rem;font-weight:600}a{color:#0969da;text-decoration:none}a:hover{text-decoration:underline}#status{color:#656d76}.date{font-weight:600}ul{padding-left:20px;line-height:1.55}.fallback h2{margin-top:32px;border-top:1px solid #d8dee4;padding-top:24px}.fallback h2:first-of-type{border-top:0;margin-top:8px}.fallback h3{margin-top:22px}.fallback hr{border:0;border-top:1px solid #d8dee4;margin:28px 0}@media(max-width:600px){body{padding:24px 12px}.card,.fallback{padding:16px}}</style></head><body><header><h1>Daily Paper Suggestions</h1><div class="sub">毎日10本。全部読むのではなく、研究に使える idea を拾うための research feed.</div></header><div id="status">Loading...</div><main id="papers"></main><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function renderJson(){const r=await fetch('latest.json?'+Date.now());if(!r.ok)throw Error('no json');const d=await r.json();document.getElementById('status').innerHTML=`<span class="date">${esc(d.date)}</span> — ${d.papers.length} papers`;document.getElementById('papers').innerHTML=d.papers.map((p,i)=>`<article class="card"><h2>${i+1}. <a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a></h2><div class="meta">${esc(p.authors)} · ${esc(p.published)}</div><div class="section"><span class="label">30秒要約</span>${marked.parse(p.summary||'')}</div><div class="section steal"><span class="label">この論文から盗むならここ</span>${marked.parse(p.steal||'')}</div><div class="section"><span class="label">自分の研究にどう使えそうか</span>${marked.parse(p.use||'')}</div><div class="section warn"><span class="label">そのまま信じない方がいい点</span>${marked.parse(p.doubt||'')}</div><div class="section"><span class="priority">${esc(p.priority||'')}</span></div></article>`).join('')}
async function renderFallback(){const today=new Date().toISOString().slice(0,10);const candidates=[today];for(let n=1;n<=14;n++){const d=new Date(Date.now()-n*86400000).toISOString().slice(0,10);candidates.push(d)}for(const date of candidates){const url=`../papers/daily/${date}.md?${Date.now()}`;const r=await fetch(url);if(r.ok){const md=await r.text();document.getElementById('status').innerHTML=`<span class="date">${esc(date)}</span> — Markdown view`;document.getElementById('papers').innerHTML=`<article class="fallback">${marked.parse(md)}</article>`;return}}throw Error('daily markdown not found')}
renderJson().catch(()=>renderFallback().catch(e=>document.getElementById('status').textContent='まだ公開データがありません: '+e.message));
</script></body></html>
